set_channels:
  fields:
    entity_id:
      required: true
      selector:
        entity:
          integration: aqua_illumination
          multiple: true
    levels:
      required: true
      example: '{"blue": 40, "deep_blue": 60}'
      selector:
        object:
set_schedule:
  fields:
    entity_id:
      required: true
      selector:
        entity:
          integration: aqua_illumination
          multiple: true
    ramps:
      required: true
      example: '[{"color": "blue", "points": [{"time": 0, "intensity": 0}, {"time": 480, "intensity": 600}, {"time": 1200, "intensity": 0}]}]'
      selector:
        object:
    name:
      selector:
        text:
sync_clock:
  fields:
    entity_id:
      required: true
      selector:
        entity:
          integration: aqua_illumination
          multiple: true
set_lunar:
  fields:
    entity_id:
      required: true
      selector:
        entity:
          integration: aqua_illumination
          multiple: true
    enable:
      selector:
        boolean:
    start:
      selector:
        time:
    end:
      selector:
        time:
apply_preset:
  fields:
    entity_id:
      required: true
      selector:
        entity:
          integration: aqua_illumination
          multiple: true
    preset:
      required: true
      example: Coral growth
      selector:
        text:
    night_glow:
      default: true
      selector:
        boolean:
save_preset:
  fields:
    entity_id:
      required: true
      selector:
        entity:
          integration: aqua_illumination
          multiple: true
    name:
      required: true
      selector:
        text:
delete_preset:
  fields:
    entity_id:
      required: true
      selector:
        entity:
          integration: aqua_illumination
          multiple: true
    name:
      required: true
      selector:
        text:
copy_schedule:
  fields:
    source:
      required: true
      selector:
        entity:
          integration: aqua_illumination
    entity_id:
      required: true
      selector:
        entity:
          integration: aqua_illumination
          multiple: true
set_stealth:
  fields:
    entity_id:
      required: true
      selector:
        entity:
          integration: aqua_illumination
          multiple: true
    enable:
      selector:
        boolean:
    dim:
      selector:
        boolean:
    intensity:
      selector:
        number:
          min: 0
          max: 100
          unit_of_measurement: "%"
    suspend:
      selector:
        number:
          min: 0
          max: 3600
          unit_of_measurement: s
