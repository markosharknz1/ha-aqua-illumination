<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Original artwork for the unofficial Aqua Illumination integration: a seven-channel
       reef light over coral. No vendor logo or text. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a1c38"/>
      <stop offset="1" stop-color="#0d3a5c"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4faff"/>
      <stop offset="1" stop-color="#9cc4f2"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8ec5ff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#8ec5ff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7a5cff"/>
      <stop offset="0.5" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="sand" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e3d4a8"/>
      <stop offset="1" stop-color="#c2ae7c"/>
    </linearGradient>
    <clipPath id="badge"><rect x="16" y="16" width="480" height="480" rx="104"/></clipPath>
  </defs>

  <!-- badge -->
  <rect x="16" y="16" width="480" height="480" rx="104" fill="url(#bg)"/>

  <g clip-path="url(#badge)">
    <!-- light cone -->
    <polygon points="120,136 392,136 478,430 34,430" fill="url(#beam)"/>
    <!-- sand -->
    <path d="M0 438 Q256 392 512 438 L512 512 L0 512 Z" fill="url(#sand)"/>
  </g>

  <!-- coral, standing on the sand -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M256 442 L256 330 M256 384 L206 330 L196 286 M256 350 L312 300 L322 256 M206 330 L166 322 M312 300 L352 296"
          stroke="#ff7d8c" stroke-width="20"/>
    <path d="M168 440 L168 372 L140 336 M168 396 L198 372"
          stroke="#2fd1b5" stroke-width="16"/>
    <path d="M356 440 L356 380 L388 344 M356 404 L330 384"
          stroke="#f5a524" stroke-width="16"/>
  </g>
  <circle cx="196" cy="282" r="10" fill="#ff9aa6"/>
  <circle cx="322" cy="252" r="10" fill="#ff9aa6"/>
  <circle cx="140" cy="332" r="8" fill="#6ff0d8"/>
  <circle cx="388" cy="340" r="8" fill="#ffc857"/>

  <!-- light fixture + seven channel LEDs -->
  <rect x="86" y="76" width="340" height="62" rx="31" fill="url(#bar)"/>
  <rect x="96" y="130" width="320" height="10" rx="5" fill="url(#glow)" opacity="0.9"/>
  <g>
    <circle cx="140" cy="107" r="11" fill="#b3202a"/>
    <circle cx="181" cy="107" r="11" fill="#8f5bff"/>
    <circle cx="222" cy="107" r="11" fill="#2740c9"/>
    <circle cx="256" cy="107" r="11" fill="#a06bd6"/>
    <circle cx="290" cy="107" r="11" fill="#ffffff" stroke="#9cc4f2" stroke-width="2"/>
    <circle cx="331" cy="107" r="11" fill="#3fb26b"/>
    <circle cx="372" cy="107" r="11" fill="#3b82f6"/>
  </g>

  <!-- bubbles -->
  <g fill="none" stroke="#cfe6ff" stroke-width="3" opacity="0.7">
    <circle cx="224" cy="222" r="9"/>
    <circle cx="246" cy="190" r="6"/>
    <circle cx="378" cy="214" r="8"/>
    <circle cx="150" cy="250" r="6"/>
  </g>
</svg>
